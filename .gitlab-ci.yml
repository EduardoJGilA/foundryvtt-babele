image: node:22-alpine

before_script:
  - apk update
  - apk add zip

stages:
  - build

build:
  stage: build
  script:
    - node scripts/prepare-release-manifest.mjs
    - zip babele.zip -r module -x ".*"
  artifacts:
    name: babele
    when: on_success
    expire_in: never
    paths:
      - module/module.json
      - babele.zip
  when: on_success
  only:
    - tags
